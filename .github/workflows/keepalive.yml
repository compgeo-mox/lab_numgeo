# GitHub automatically disables scheduled workflows (like "Check tutorials")
# after 60 days without repository activity -- there is no setting to opt
# out of this. This workflow makes a trivial commit well within that
# window, which resets the inactivity clock for the whole repo and keeps
# the real schedule running even during months nobody touches this repo.
name: Keepalive Workflow

on:
  schedule:
    - cron: "0 2 1 * *" # once a month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
